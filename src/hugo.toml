baseURL = 'https://mathieu.scheltienne.net'
copyright = "© Mathieu Scheltienne"
locale = 'en-us'
theme = 'hugo-coder'
title = 'Mathieu Scheltienne'

[markup.highlight]
style = "github-dark"

[[menu.main]]
name = "About me"
url = "about/"
weight = 1

[[menu.main]]
name = "Open-source projects"
url = "open-source-projects"
weight = 2

[module.hugoVersion]
extended = true
min = "0.158.0"

# Defining a mount replaces the default one for its target: keep assets/.
[[module.mounts]]
source = "assets"
target = "assets"

# Rendering shared with the github-stats Cloudflare Worker (worker/).
[[module.mounts]]
source = "../worker/src/render.js"
target = "assets/js/github-highlights/render.js"

[params]
author = "Mathieu Scheltienne"
avatarurl = "img/avatar_mathieu.jpg"
colorScheme = "auto"
customCSS = ["css/custom.css"]
enableTwemoji = true
hidecolorschemetoggle = false
info = "Engineer, Developer, Open-source and Python enthusiast"
keywords = "developer,personal"

[params.cloudflare]
token = "dcb3128e14fe42dcb6e0ef9fd62cbe53"

[params.githubHighlights]
# Served by the github-stats Cloudflare Worker (worker/). To test locally
# against `wrangler dev`, set HUGO_PARAMS_GITHUBHIGHLIGHTS_ENDPOINT.
endpoint = "https://github-stats.scheltienne.net/data.json"
stats = [
  "commits",
  "pullRequestsMerged",
  "reviews",
  "repositories",
  "organizations",
]

